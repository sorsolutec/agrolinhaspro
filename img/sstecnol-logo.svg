<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Metallic Outer Gradients -->
    <radialGradient id="outerBezel" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cfd8dc" />
      <stop offset="70%" stop-color="#90a4ae" />
      <stop offset="90%" stop-color="#455a64" />
      <stop offset="100%" stop-color="#1c313a" />
    </radialGradient>

    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="30%" stop-color="#1976d2" />
      <stop offset="70%" stop-color="#0a2e66" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>

    <radialGradient id="silverPlate" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#eceff1" />
      <stop offset="55%" stop-color="#cfd8dc" />
      <stop offset="85%" stop-color="#90a4ae" />
      <stop offset="100%" stop-color="#546e7a" />
    </radialGradient>

    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="50%" stop-color="#0044cc" />
      <stop offset="100%" stop-color="#002288" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Circular Text Paths -->
    <path id="topTextPath" d="M 42,150 A 108,108 0 0,1 258,150" fill="none" />
    <path id="bottomTextPath" d="M 258,150 A 108,108 0 0,1 42,150" fill="none" />
  </defs>

  <!-- Base Shadow & Outer Ring -->
  <circle cx="150" cy="150" r="142" fill="url(#outerBezel)" filter="url(#shadow)" stroke="#1a2e3b" stroke-width="2" />
  <circle cx="150" cy="150" r="136" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
  
  <!-- Outer Blue Notched Ring -->
  <circle cx="150" cy="150" r="132" fill="url(#blueRing)" stroke="#263238" stroke-width="2" />
  <circle cx="150" cy="150" r="126" fill="none" stroke="#00d2ff" stroke-width="0.8" opacity="0.6" />

  <!-- Tick Marks & Tech Accents -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.7">
    <line x1="150" y1="12" x2="150" y2="18" />
    <line x1="150" y1="282" x2="150" y2="288" />
    <line x1="12" y1="150" x2="18" y2="150" />
    <line x1="282" y1="150" x2="288" y2="150" />
    <!-- Secondary small ticks -->
    <circle cx="80" cy="30" r="1.5" fill="#fff" />
    <circle cx="220" cy="30" r="1.5" fill="#fff" />
    <circle cx="80" cy="270" r="1.5" fill="#fff" />
    <circle cx="220" cy="270" r="1.5" fill="#fff" />
  </g>

  <!-- Circular Text -->
  <text font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="2">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      CERTIFIED SSTECNOL DIGITAL AUTHENTICITY
    </textPath>
  </text>

  <text font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#e0f7fa" letter-spacing="2">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      SELO DE AUTORIA • DIGITAL PROVENANCE
    </textPath>
  </text>

  <!-- Inner Silver Medallion -->
  <circle cx="150" cy="150" r="98" fill="url(#silverPlate)" stroke="#1c313a" stroke-width="3" />
  <circle cx="150" cy="150" r="95" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
  <circle cx="150" cy="150" r="90" fill="none" stroke="#78909c" stroke-width="0.8" stroke-dasharray="3, 3" />

  <!-- SSTecnol Symbol Logo (Infinity / Stylized S loop) -->
  <g transform="translate(68, 115) scale(0.9)">
    <path d="M 22,25 C 22,11 33,0 47,0 C 61,0 72,11 72,25 C 72,36 63,44 54,50 L 30,66 C 21,72 16,80 16,91 C 16,105 27,116 41,116 C 55,116 66,105 66,91" 
          fill="none" stroke="url(#logoBlueGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 66,25 C 66,11 55,0 41,0 C 27,0 16,11 16,25 C 16,36 25,44 34,50 L 58,66 C 67,72 72,80 72,91 C 72,105 61,116 47,116 C 33,116 22,105 22,91" 
          fill="none" stroke="#1565c0" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <!-- Inner glowing dot -->
    <circle cx="44" cy="58" r="4" fill="#00e5ff" />
  </g>

  <!-- Center Text Branding -->
  <text x="145" y="146" font-family="'Inter', sans-serif" font-size="23" font-weight="900" fill="#0d2b45" letter-spacing="-0.5">SSTecnol</text>
  <text x="150" y="180" font-family="'Inter', sans-serif" font-size="25" font-weight="900" fill="#0a3d62" text-anchor="middle" letter-spacing="1">2026</text>
  
  <text x="150" y="196" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#546e7a" text-anchor="middle" letter-spacing="0.5">A.003-2024 / ID-456</text>

  <!-- Bottom Key / Security Chip Emblem -->
  <g transform="translate(142, 260) scale(0.7)" fill="#00e5ff">
    <circle cx="11" cy="5" r="4" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 11,9 L 11,22 L 15,22 L 15,18 L 11,18" fill="none" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
